<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title or '在线问卷系统' }}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f5f7fb}.navbar-brand{font-weight:700}.card{border:0;box-shadow:0 4px 18px #1d355710}.question-card{border-left:4px solid #0d6efd}</style></head><body><nav class="navbar navbar-dark bg-primary mb-4"><div class="container"><a class="navbar-brand" href="{{ url_for('index') }}">在线问卷系统</a><div>{% if current_user %}<span class="text-white me-3">{{ current_user.username }}</span><a class="btn btn-sm btn-light" href="{{ url_for('logout') }}">退出</a>{% else %}<a class="btn btn-sm btn-light" href="{{ url_for('login') }}">登录</a>{% endif %}</div></div></nav><main class="container pb-5">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-{{category}}">{{message}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>

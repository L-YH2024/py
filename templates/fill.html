{% extends 'base.html' %}{% block content %}<div class="card p-4"><h2>{{survey.title}}</h2><p class="text-muted">{{survey.description}}</p><form method="post" onsubmit="return validateSurvey()">{% for q in survey.questions %}<div class="question-card card p-3 mb-3"><h5>{{loop.index}}. {{q.text}} {% if q.required %}<span class="text-danger">*</span>{% endif %}</h5>{% if q.kind=='text' %}<textarea class="form-control" name="question_{{q.id}}" {% if q.required %}required{% endif %}></textarea>{% else %}{% for o in q.options %}<div class="form-check"><input class="form-check-input" type="{{'radio' if q.kind=='single' else 'checkbox'}}" name="question_{{q.id}}" value="{{o.id}}" {% if q.required and q.kind=='single' %}required{% endif %}><label class="form-check-label">{{o.text}}</label></div>{% endfor %}{% endif %}</div>{% endfor %}<button class="btn btn-primary">提交回答</button></form></div><script>function validateSurvey(){let valid=true;document.querySelectorAll('input[type=checkbox][data-required]').forEach(()=>{});{% for q in survey.questions if q.kind=='multiple' and q.required %}if(!document.querySelectorAll('input[name="question_{{q.id}}"]:checked').length){alert('请至少选择一项：{{q.text|e}}');valid=false;}{% endfor %}return valid;}</script>{% endblock %}

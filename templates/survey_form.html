{% extends 'base.html' %}{% block content %}<div class="card p-4"><h2>创建问卷</h2><form method="post"><label class="form-label">标题</label><input class="form-control" name="title" required><label class="form-label mt-3">说明</label><textarea class="form-control" name="description"></textarea><label class="form-label mt-3">截止时间（可选）</label><input class="form-control" type="datetime-local" name="deadline"><hr><h5>题目</h5><div id="questions"></div><button type="button" class="btn btn-outline-secondary" onclick="addQuestion()">+ 添加题目</button><button class="btn btn-primary ms-2">保存问卷</button></form></div><script>let n=0;function addQuestion(){let i=n++;document.querySelector('#questions').insertAdjacentHTML('beforeend',`<div class="question-card card p-3 mb-3"><input class="form-control mb-2" name="question_text" placeholder="题目内容" required><select class="form-select mb-2" name="question_kind" onchange="this.nextElementSibling.style.display=this.value==='text'?'none':'block'"><option value="single">单选题</option><option value="multiple">多选题</option><option value="text">填空题</option></select><input class="form-control mb-2" name="question_options" placeholder="选项用 | 分隔，如：非常满意|满意|一般|不满意"><label><input type="checkbox" checked name="required_question" value="${i}"> 必填</label></div>`)}addQuestion()</script>{% endblock %}

{% extends 'base.html' %}{% block content %}
<div class="card p-4"><h2>{{ '编辑问卷' if editing else '创建问卷' }}</h2>
<form method="post"><label class="form-label">标题</label><input class="form-control" name="title" value="{{ survey.title if survey else '' }}" required>
<label class="form-label mt-3">说明</label><textarea class="form-control" name="description">{{ survey.description if survey else '' }}</textarea>
<label class="form-label mt-3">截止时间（可选）</label><input class="form-control" type="datetime-local" name="deadline" value="{{ survey.deadline.strftime('%Y-%m-%dT%H:%M') if survey and survey.deadline else '' }}">
<hr><h5>题目</h5><div id="questions">{% if survey %}{% for q in survey.questions %}<div class="question-card card p-3 mb-3"><input class="form-control mb-2" name="question_text" value="{{q.text}}" required><select class="form-select mb-2" name="question_kind"><option value="single" {% if q.kind=='single' %}selected{% endif %}>单选题</option><option value="multiple" {% if q.kind=='multiple' %}selected{% endif %}>多选题</option><option value="text" {% if q.kind=='text' %}selected{% endif %}>填空题</option></select><input class="form-control mb-2" name="question_options" value="{{q.options|map(attribute='text')|join('|')}}" placeholder="选项用 | 分隔"><label><input type="checkbox" name="required_question" value="{{loop.index0}}" {% if q.required %}checked{% endif %}> 必填</label></div>{% endfor %}{% endif %}</div>
<button type="button" class="btn btn-outline-secondary" onclick="addQuestion()">+ 添加题目</button><button class="btn btn-primary ms-2">保存问卷</button></form></div>
<script>let n={{survey.questions|length if survey else 0}};function addQuestion(){let i=n++;document.querySelector('#questions').insertAdjacentHTML('beforeend',`<div class="question-card card p-3 mb-3"><input class="form-control mb-2" name="question_text" placeholder="题目内容" required><select class="form-select mb-2" name="question_kind"><option value="single">单选题</option><option value="multiple">多选题</option><option value="text">填空题</option></select><input class="form-control mb-2" name="question_options" placeholder="选项用 | 分隔，如：非常满意|满意|一般"><label><input type="checkbox" checked name="required_question" value="${i}"> 必填</label></div>`)}{% if not survey %}addQuestion(){% endif %}</script>
{% endblock %}
